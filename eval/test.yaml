model: "anthropic/claude-haiku-4.5"
provider: "Anthropic"
output_dir: "results"
max_concurrent: 5
default_size: 5
default_seed: 45

categories:
  - category: "algorithmic"
    datasets:
      - dataset: "number_filtering"
      - dataset: "number_sorting"
  - category: "cognition"
    datasets: 
      - dataset: "figlet_font"
